# Dutch quantum centres for scripts/compare_centres.py (internal funding comparison).
#
# Per centre:
#   affiliation   regex for the first page of a paper: only papers that match count for the centre
#   own_funds     regex for the host's own money in acknowledgements ("Host institution funds")
#   cordis_orgs   regex for the host organisations in CORDIS (EU), which lists universities, not centres
#   pis           PIs: names as on arXiv; `aliases` adds other spellings (initials, no accents)
#
# PI lists were compiled on 2026-10-22 from the centres' websites (QuTech from search snippets and its
# 2025 annual report, as qutech.nl was unreachable). Please correct them: PIs left out on purpose are
# listed under `left_out`.

since: 2018-01-01

centres:
  qusoft:
    name: QuSoft
    affiliation: 'QuSoft'
    own_funds: '\bCWI\b|Centrum\s+Wiskunde|University\s+of\s+Amsterdam|\bUvA\b'
    cordis_orgs: 'UNIVERSITEIT VAN AMSTERDAM|STICHTING NEDERLANDSE WETENSCHAPPELIJK ONDERZOEK INSTITUTEN'
    cordis_orgs_label: 'UvA + NWO-I (CWI and other NWO institutes)'
    use_site_database: true   # the site's database already has every paper with QuSoft on the first page
    pis: people.csv           # senior researchers in people.csv

